<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0EA5E9" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield/Square -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#brand-grad)" filter="url(#shadow)"/>
  
  <!-- Medical Plus with subtle pulse accent -->
  <path d="M32 16V48M16 32H48" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Center Heartbeat / Care Accent -->
  <circle cx="32" cy="32" r="3.5" fill="#38BDF8"/>
</svg>
